<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Code Review</title>
<!-- WebReviewPanel replaces the marker below with  window.UI_TEXT = {...}  built from ui/ui-text.yml.
     Every visible string in this page is looked up from that map — there is no hard-coded UI text. -->
<script>/*@UI_TEXT@*/</script>
<style>
/* ─────────────────────────────────────────────────────────────
   Theme tokens. The plugin can override any of these at runtime:
   AICR.theme({bg:"#1e1f22", fg:"#dfe1e5", accent:"#7f52ff"})
   ───────────────────────────────────────────────────────────── */
:root{
  --bg:#1b1d21;
  --bg-sunken:#161719;
  --bg-raised:#232629;
  --bg-hover:#2b2f33;
  --line:#33383d;
  --line-soft:#292d31;
  --fg:#d6dae0;
  --fg-dim:#8b929b;
  --fg-faint:#5f666e;
  --accent:#a78bfa;
  --accent-soft:#a78bfa26;
  --sev-blocker:#f0616d;
  --sev-major:#e0a13a;
  --sev-minor:#4aa8d8;
  --sev-nit:#6f7780;
  --ok:#4cbf83;
  --radius:6px;
  --mono:ui-monospace,"JetBrains Mono","SF Mono",Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Inter,sans-serif;
  --step:13px;
}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--bg);color:var(--fg);
  font:var(--step)/1.55 var(--sans);
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
button,select,input{font:inherit;color:inherit}
::selection{background:var(--accent-soft)}
[hidden]{display:none!important}

*::-webkit-scrollbar{width:10px;height:10px}
*::-webkit-scrollbar-track{background:transparent}
*::-webkit-scrollbar-thumb{background:#3a4046;border:3px solid transparent;background-clip:content-box;border-radius:8px}
*::-webkit-scrollbar-thumb:hover{background:#4d555d;border:3px solid transparent;background-clip:content-box}
*{scrollbar-width:thin;scrollbar-color:#3a4046 transparent}

.app{display:flex;flex-direction:column;height:100%;min-height:0}
.pane{display:flex;flex-direction:column;min-height:0}
.scroll{overflow-y:auto;overflow-x:auto;min-height:0;overscroll-behavior:contain}
.spacer{flex:1}

/* ── Toolbar ─────────────────────────────────────────────────── */
header{flex:0 0 auto;padding:10px 12px 8px;border-bottom:1px solid var(--line);background:var(--bg)}
.titlerow{display:flex;align-items:center;gap:6px;margin-bottom:9px}
h1{margin:0;font-size:13px;font-weight:600;letter-spacing:.2px}
.controls{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
label.lbl{color:var(--fg-dim);font-size:12px}

select,.btn{
  background:var(--bg-raised);border:1px solid var(--line);
  border-radius:var(--radius);padding:5px 10px;cursor:pointer;
  transition:background .12s,border-color .12s,color .12s,transform .08s;
}
select{padding-right:26px;appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--fg-dim) 50%),linear-gradient(135deg,var(--fg-dim) 50%,transparent 50%);
  background-position:calc(100% - 14px) 52%,calc(100% - 9px) 52%;
  background-size:5px 5px;background-repeat:no-repeat}
.btn:hover:not(:disabled),select:hover{background:var(--bg-hover);border-color:#454b52}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled{opacity:.4;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#17131f;font-weight:600}
.btn.primary:hover:not(:disabled){filter:brightness(1.08);background:var(--accent)}
.btn.icon{padding:5px 7px;line-height:1;color:var(--fg-dim)}
.btn.icon:hover{color:var(--fg)}
.btn.small{font-size:11.5px;padding:3px 9px}
.btn.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

.model{display:flex;align-items:center;gap:6px;margin-top:8px;font:11px/1.4 var(--mono);color:var(--fg-faint)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--fg-faint);flex:0 0 auto}
.dot.live{background:var(--ok);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}

.progress{height:2px;background:var(--line-soft);position:relative;overflow:hidden;flex:0 0 auto}
.progress i{position:absolute;inset:0;width:35%;background:var(--accent);transform:translateX(-100%);border-radius:2px}
.progress.run i{animation:slide 1.1s ease-in-out infinite}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(330%)}}

/* ── Filter bar ──────────────────────────────────────────────── */
.filters{flex:0 0 auto;display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:8px 12px;border-bottom:1px solid var(--line-soft)}
.search{flex:1 1 150px;min-width:120px;display:flex;align-items:center;gap:6px;
  background:var(--bg-sunken);border:1px solid var(--line);border-radius:var(--radius);padding:4px 8px}
.search:focus-within{border-color:var(--accent)}
.search input{flex:1;min-width:0;background:none;border:0;outline:none;font-size:12px}
.search input::placeholder{color:var(--fg-faint)}
.search .x{background:none;border:0;color:var(--fg-faint);cursor:pointer;padding:0 2px}
.search .x:hover{color:var(--fg)}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;
  border:1px solid var(--line);background:var(--bg-raised);font-size:11.5px;
  color:var(--fg-dim);cursor:pointer;user-select:none;transition:.12s}
.chip:hover{background:var(--bg-hover)}
.chip[data-sev][aria-pressed=true]{color:var(--fg);border-color:currentColor}
.chip .sw{width:7px;height:7px;border-radius:2px;background:currentColor}
.chip.blocker{color:var(--sev-blocker)} .chip.major{color:var(--sev-major)}
.chip.minor{color:var(--sev-minor)}     .chip.nit{color:var(--sev-nit)}
.chip[data-sev][aria-pressed=false]{color:var(--fg-faint);opacity:.55}
.chip.opt[aria-pressed=true]{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.chip [data-count]{font:10.5px var(--mono)}

/* ── Findings ────────────────────────────────────────────────── */
.output{flex:1 1 auto;min-height:0;display:flex}
.spine{flex:0 0 26px;border-right:1px solid var(--line-soft);padding:10px 0;display:flex;flex-direction:column;
  align-items:center;gap:5px;overflow:hidden;background:var(--bg-sunken)}
.spine b{width:8px;height:8px;border-radius:50%;cursor:pointer;flex:0 0 auto;transition:transform .12s,box-shadow .12s,opacity .12s}
.spine b:hover{transform:scale(1.55)}
.spine b.active{box-shadow:0 0 0 3px var(--accent-soft);transform:scale(1.3)}
.spine b.done{opacity:.3}
.list{flex:1 1 auto;min-width:0;padding:4px 0 24px}

.empty{padding:44px 22px;text-align:center;color:var(--fg-faint);max-width:360px;margin:0 auto}
.empty strong{display:block;color:var(--fg-dim);font-weight:600;margin-bottom:5px;font-size:13px}
.empty .actions{display:flex;gap:8px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.empty.err strong{color:var(--sev-blocker)}
.spinner{width:18px;height:18px;margin:0 auto 12px;border-radius:50%;border:2px solid var(--line);
  border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Summary card */
.summary{margin:8px 12px 10px;padding:10px 12px;border:1px solid var(--line-soft);border-radius:var(--radius);background:var(--bg-raised)}
.s-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.s-head h2{margin:0;font-size:12px;font-weight:600;color:var(--fg-dim);text-transform:uppercase;letter-spacing:.6px}
.risk{font:10px/1 var(--mono);font-weight:700;letter-spacing:.6px;padding:4px 7px;border-radius:4px;
  background:var(--bg-hover);color:var(--fg-dim);text-transform:uppercase}
.risk.high,.risk.critical{background:#f0616d22;color:var(--sev-blocker)}
.risk.medium{background:#e0a13a22;color:var(--sev-major)}
.risk.low{background:#4cbf8322;color:var(--ok)}
.s-counts{display:flex;gap:10px;font:11px var(--mono);color:var(--fg-faint)}
.s-counts span::before{content:"";display:inline-block;width:7px;height:7px;border-radius:2px;margin-right:5px;background:var(--c)}
.summary p{margin:8px 0 0;color:var(--fg-dim)}
.bar{height:4px;background:var(--line-soft);border-radius:4px;margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--ok);border-radius:4px;transition:width .25s}
.s-res{display:block;margin-top:5px;font:11px var(--mono);color:var(--fg-faint)}

.group{display:flex;align-items:center;gap:8px;padding:10px 12px 4px 14px;font:11px var(--mono);color:var(--fg-dim);
  position:sticky;top:0;background:var(--bg);z-index:1;border-bottom:1px solid var(--line-soft)}
.group .n{color:var(--fg-faint)}

.finding{border-bottom:1px solid var(--line-soft);position:relative;transition:opacity .15s}
.finding::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--sev)}
.finding.hidden{display:none}
.finding.cur{background:var(--bg-raised)}
.finding.cur::before{width:3px}
.finding.resolved{opacity:.5}
.finding.resolved .f-title{text-decoration:line-through;text-decoration-color:var(--fg-faint)}
.f-head{display:flex;gap:8px;align-items:flex-start;width:100%;text-align:left;
  padding:9px 10px 9px 14px;background:none;border:0;cursor:pointer;outline-offset:-2px}
.f-head:hover{background:var(--bg-raised)}
.caret{color:var(--fg-faint);transition:transform .15s;margin-top:3px;flex:0 0 auto;font-size:10px}
.finding[open] .caret{transform:rotate(90deg)}
.f-main{flex:1;min-width:0}
.f-title{font-weight:500;word-break:break-word}
.f-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:3px;font:11px/1.4 var(--mono);color:var(--fg-faint)}
.f-meta .sev{color:var(--sev);text-transform:uppercase;letter-spacing:.6px;font-size:10px;font-weight:700}
.loc{color:var(--fg-dim);cursor:pointer;text-decoration:none;border-bottom:1px dotted var(--line)}
.loc:hover{color:var(--accent);border-color:var(--accent)}
.tick{flex:0 0 auto;width:20px;height:20px;border-radius:50%;border:1px solid var(--line);background:none;
  color:transparent;cursor:pointer;font-size:11px;line-height:1;padding:0;margin-top:1px;transition:.12s}
.tick:hover{border-color:var(--ok);color:var(--ok)}
.resolved .tick{background:var(--ok);border-color:var(--ok);color:#10261a}
.f-body{display:none;padding:0 12px 14px 34px}
.finding[open] .f-body{display:block;animation:fade .16s ease-out}
@keyframes fade{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}
.f-body p{margin:0 0 10px;white-space:pre-wrap}
.f-body .lab{display:block;font:10px var(--mono);text-transform:uppercase;letter-spacing:.6px;color:var(--fg-faint);margin-bottom:2px}
.f-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
mark{background:var(--accent-soft);color:var(--fg);border-radius:2px;padding:0 1px}

.code{position:relative;margin:10px 0;background:var(--bg-sunken);border:1px solid var(--line-soft);border-radius:var(--radius)}
.code.fix{border-color:#4cbf8355}
.code .c-head{display:flex;align-items:center;padding:4px 6px 4px 12px;border-bottom:1px solid var(--line-soft);
  font:10px var(--mono);text-transform:uppercase;letter-spacing:.6px;color:var(--fg-faint)}
.code.fix .c-head{color:var(--ok)}
.code pre{margin:0;padding:10px 12px;overflow-x:auto;font:12px/1.6 var(--mono)}
.wrap-on .code pre,.wrap-on .stream{white-space:pre-wrap;word-break:break-word}
code.inl{font:12px var(--mono);background:var(--bg-sunken);padding:1px 5px;border-radius:3px;color:#c8b6ff}

/* ── Splitter / tabs ─────────────────────────────────────────── */
.splitter{flex:0 0 7px;cursor:row-resize;background:var(--bg);border-top:1px solid var(--line);border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:center}
.splitter::after{content:"";width:34px;height:2px;border-radius:2px;background:var(--line)}
.splitter:hover::after,.splitter.drag::after{background:var(--accent)}
.tabs{flex:0 0 auto;display:flex;align-items:center;gap:2px;padding:0 8px;border-bottom:1px solid var(--line-soft)}
.tab{background:none;border:0;padding:8px 11px;color:var(--fg-dim);cursor:pointer;border-bottom:2px solid transparent;font-size:12px;white-space:nowrap}
.tab:hover{color:var(--fg)}
.tab[aria-selected=true]{color:var(--fg);border-bottom-color:var(--accent)}
.tab .n{font:10px var(--mono);color:var(--fg-faint);margin-left:5px}
.panel{flex:1 1 auto;min-height:0;display:none;padding:10px 12px}
.panel.show{display:block}
.stream{margin:0;font:12px/1.65 var(--mono);white-space:pre;color:var(--fg-dim)}
.stream .k{color:var(--accent)} .stream .g{color:var(--ok)} .stream .w{color:var(--sev-major)} .stream .e{color:var(--sev-blocker)}

footer{flex:0 0 auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:6px 12px;border-top:1px solid var(--line);
  font:11px var(--mono);color:var(--fg-faint);background:var(--bg-sunken)}
#elapsed{color:var(--accent)}
.hint{cursor:pointer}
.hint:hover{color:var(--fg-dim)}
kbd{font:10px var(--mono);background:var(--bg-raised);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:1px 5px;color:var(--fg-dim)}

/* ── Toast / help overlay ────────────────────────────────────── */
#toast{position:fixed;left:50%;bottom:44px;translate:-50% 12px;opacity:0;pointer-events:none;
  background:var(--bg-raised);border:1px solid var(--line);border-left:2px solid var(--ok);
  padding:7px 14px;border-radius:var(--radius);font-size:12px;box-shadow:0 8px 24px #0009;transition:opacity .18s,translate .18s;z-index:50}
#toast.show{opacity:1;translate:-50% 0}
#toast.err{border-left-color:var(--sev-blocker)}
#help{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:60;padding:16px}
#help .box{background:var(--bg-raised);border:1px solid var(--line);border-radius:8px;padding:14px 16px;width:min(360px,100%);
  max-height:100%;overflow:auto;box-shadow:0 16px 40px #000b}
#help h2{margin:0 0 10px;font-size:13px}
#help dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0 0 12px;font-size:12px}
#help dt{text-align:right;white-space:nowrap}
#help dd{margin:0;color:var(--fg-dim)}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:420px){.f-body{padding-left:14px}.spine{display:none}}
</style>

<div class="app">
  <header>
    <div class="titlerow">
      <h1 data-t="panel.title"></h1>
      <span class="spacer"></span>
      <button class="btn icon" id="wrapBtn" data-t-title="panel.toolbar.wrap" aria-pressed="false">⏎</button>
      <button class="btn icon" id="expandBtn" data-t-title="panel.toolbar.expand">⌄</button>
      <button class="btn icon" id="copyAll" data-t-title="panel.toolbar.copyAll">⧉</button>
      <button class="btn icon" id="settingsBtn" data-t-title="panel.toolbar.settings">⚙</button>
      <button class="btn icon" id="helpBtn" data-t-title="panel.toolbar.help">?</button>
    </div>

    <div class="controls">
      <label class="lbl" for="scope" data-t="panel.scopeLabel"></label>
      <select id="scope"></select>
      <button class="btn primary" id="run" data-t="panel.run"></button>
      <button class="btn" id="stop" disabled data-t="panel.stop"></button>
    </div>

    <div class="model"><span class="dot" id="dot"></span><span id="modelLine" data-t="panel.modelLoading"></span></div>
  </header>

  <div class="progress" id="prog"><i></i></div>

  <div class="filters">
    <div class="search">
      <span style="color:var(--fg-faint)">⌕</span>
      <input id="q" data-t-ph="panel.filters.placeholder" spellcheck="false">
      <button class="x" id="qClear" hidden>✕</button>
    </div>
    <button class="chip blocker" data-sev="blocker" aria-pressed="true"><span class="sw"></span><span data-t="severity.blocker"></span><span data-count>0</span></button>
    <button class="chip major"   data-sev="major"   aria-pressed="true"><span class="sw"></span><span data-t="severity.major"></span><span data-count>0</span></button>
    <button class="chip minor"   data-sev="minor"   aria-pressed="true"><span class="sw"></span><span data-t="severity.minor"></span><span data-count>0</span></button>
    <button class="chip nit"     data-sev="nit"     aria-pressed="true" hidden><span class="sw"></span><span data-t="severity.nit"></span><span data-count>0</span></button>
    <button class="chip opt" id="hideResolved" aria-pressed="false" data-t="panel.filters.hideResolved"></button>
    <button class="chip opt" id="groupFile" aria-pressed="false" data-t="panel.filters.groupByFile"></button>
  </div>

  <div class="output" id="outPane">
    <div class="spine" id="spine"></div>
    <div class="scroll list" id="list"></div>
  </div>

  <div class="splitter" id="split" role="separator" aria-orientation="horizontal" tabindex="0" data-t-aria="panel.tabs.resize"></div>

  <div class="pane" id="bottom" style="height:210px">
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" aria-selected="true"  data-tab="trace"><span data-t="panel.tabs.trace"></span><span class="n" id="nTrace">0</span></button>
      <button class="tab" role="tab" aria-selected="false" data-tab="stream"><span data-t="panel.tabs.stream"></span></button>
      <button class="tab" role="tab" aria-selected="false" data-tab="context"><span data-t="panel.tabs.context"></span><span class="n" id="nCtx">0</span></button>
      <span class="spacer"></span>
      <button class="btn icon on" id="follow" data-t-title="panel.tabs.follow" aria-pressed="true">↓</button>
      <button class="btn icon" id="copyTab" data-t-title="panel.tabs.copy">⧉</button>
      <button class="btn icon" id="clearTab" data-t-title="panel.tabs.clear">✕</button>
    </div>
    <div class="scroll panel show" id="p-trace" role="tabpanel"><pre class="stream" id="trace" data-t="panel.tabs.waiting"></pre></div>
    <div class="scroll panel"      id="p-stream" role="tabpanel"><pre class="stream" id="stream" data-t="panel.tabs.waiting"></pre></div>
    <div class="scroll panel"      id="p-context" role="tabpanel"><pre class="stream" id="context" data-t="panel.tabs.noContext"></pre></div>
  </div>

  <footer>
    <span id="status" data-t="status.idle"></span>
    <span id="elapsed" hidden></span>
    <span class="spacer"></span>
    <span class="hint" data-click="run"><kbd>Ctrl</kbd><kbd>↵</kbd> <span data-t="panel.footer.runHint"></span></span>
    <span class="hint" data-click="stop"><kbd>Esc</kbd> <span data-t="panel.footer.stopHint"></span></span>
    <span class="hint" data-click="helpBtn"><kbd>?</kbd> <span data-t="panel.footer.helpHint"></span></span>
  </footer>
</div>

<div id="help" hidden role="dialog" aria-modal="true">
  <div class="box">
    <h2 data-t="panel.help.title"></h2>
    <dl id="helpList"></dl>
    <button class="btn small" id="helpClose" data-t="panel.help.close"></button>
  </div>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
"use strict";
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];

/* ══════════════════════════════════════════════════════════════
   0. Text — everything comes from ui-text.yml via window.UI_TEXT
   ══════════════════════════════════════════════════════════════ */
let TXT=Object.assign({},window.UI_TEXT||{});
function t(key,vars){
  let s=Object.prototype.hasOwnProperty.call(TXT,key)?TXT[key]:key;
  if(vars) for(const n in vars) s=s.split("{"+n+"}").join(String(vars[n]));
  return s;
}
function applyText(root){
  root=root||document;
  $$("[data-t]",root).forEach(n=>{ n.textContent=t(n.dataset.t); });
  $$("[data-t-title]",root).forEach(n=>{ n.title=t(n.dataset.tTitle); });
  $$("[data-t-ph]",root).forEach(n=>{ n.placeholder=t(n.dataset.tPh); });
  $$("[data-t-aria]",root).forEach(n=>{ n.setAttribute("aria-label",t(n.dataset.tAria)); });
  $$(".chip[data-sev]").forEach(c=>{ c.title=t("panel.filters.severityTip",{label:t("severity."+c.dataset.sev)}); });
  document.title=t("panel.title");
  buildScopes(); buildHelp();
}

const SCOPES=["UNCOMMITTED","STAGED","LAST_COMMIT","LAST_N_COMMITS","BRANCH_VS_BASE","CURRENT_FILE"];
function buildScopes(){
  const sel=$("#scope"), cur=sel.value||SCOPES[0];
  sel.innerHTML="";
  SCOPES.forEach(id=>sel.appendChild(new Option(t("scopes."+id),id)));
  sel.value=cur;
}
const HELP=[["Ctrl+↵","run"],["Esc","stop"],["J / ↓","next"],["K / ↑","prev"],["↵ / Space","toggle"],["O","open"],
  ["C","copy"],["X","resolve"],["Ctrl+F","search"],["Alt+Z","wrap"],["Alt+E","expand"],["Ctrl+Shift+C","copyAll"],["?","help"]];
function buildHelp(){
  $("#helpList").innerHTML=HELP.map(([k,id])=>
    `<dt>${k.split(" / ").map(x=>"<kbd>"+esc(x)+"</kbd>").join(" ")}</dt><dd>${esc(t("panel.help."+id))}</dd>`).join("");
}

/* ══════════════════════════════════════════════════════════════
   1. Copy — IDE bridge first, then the async clipboard, then execCommand
   ══════════════════════════════════════════════════════════════ */
async function copyText(text){
  if(!text) return false;
  try{ if(typeof window.ideCopy==="function"){ window.ideCopy(text); return true; } }catch(e){}
  try{ if(navigator.clipboard&&window.isSecureContext){ await navigator.clipboard.writeText(text); return true; } }catch(e){}
  try{
    const sel=document.getSelection(), saved=sel&&sel.rangeCount?sel.getRangeAt(0):null;
    const ta=document.createElement("textarea");
    ta.value=text; ta.setAttribute("readonly","");
    ta.style.cssText="position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;pointer-events:none";
    document.body.appendChild(ta);
    ta.focus({preventScroll:true}); ta.select(); ta.setSelectionRange(0,ta.value.length);
    const ok=document.execCommand("copy");
    ta.remove();
    if(saved&&sel){ sel.removeAllRanges(); sel.addRange(saved); }
    return ok;
  }catch(e){ return false; }
}
async function copyAndTell(text,label){
  const ok=await copyText(text);
  toast(ok?t("panel.toast.copied",{label:label||t("panel.toast.copiedDefault"),chars:text.length.toLocaleString()})
         :t("panel.toast.copyBlocked"), !ok);
}
let toastT;
function toast(msg,isErr){
  const el=$("#toast"); el.textContent=msg; el.classList.toggle("err",!!isErr); el.classList.add("show");
  clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove("show"),isErr?4200:1800);
}

/* ══════════════════════════════════════════════════════════════
   2. State + render
   ══════════════════════════════════════════════════════════════ */
const SEV={blocker:"var(--sev-blocker)",major:"var(--sev-major)",minor:"var(--sev-minor)",nit:"var(--sev-nit)"};
const RANK={blocker:0,major:1,minor:2,nit:3};
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const inline=s=>esc(s).replace(/`([^`]+)`/g,'<code class="inl">$1</code>');
const keyOf=f=>f.file+":"+f.line+":"+f.title;

let DATA=[], SUMMARY=null, VIEW="idle", ERRMSG="", cur=-1;
const RESOLVED=new Set();

function sevLabel(s){ return t("severity."+s); }
function locText(f){ return f.file?(f.file.split("/").pop()+(f.line?":"+f.line:"")):""; }

function render(items){
  DATA=(items||[]).map((f,i)=>Object.assign({i},f));
  VIEW="results"; cur=-1;
  draw();
}

function draw(){
  const list=$("#list"), spine=$("#spine");
  list.innerHTML=""; spine.innerHTML="";
  if(VIEW==="idle")    return emptyState("panel.empty.title","panel.empty.body",[["run","panel.run",true]]);
  if(VIEW==="running") return emptyState("panel.empty.reviewingTitle","panel.empty.reviewingBody",[],true);
  if(VIEW==="error")   return emptyState("panel.empty.failedTitle",null,[["run","panel.rerun",true],["settings","panel.openSettings"]],false,ERRMSG);

  if(SUMMARY) list.appendChild(summaryCard());
  if(!DATA.length){
    list.appendChild(emptyEl("panel.empty.nothingTitle","panel.empty.nothingBody",[["run","panel.rerun"]]));
    counts(); filter(); return;
  }
  const grouped=$("#groupFile").getAttribute("aria-pressed")==="true";
  const order=DATA.slice().sort((a,b)=>
    (grouped?(a.file||"").localeCompare(b.file||""):0)||(RANK[a.sev]-RANK[b.sev])||(a.i-b.i));
  let lastFile=null;
  order.forEach(f=>{
    if(grouped&&f.file!==lastFile){
      lastFile=f.file;
      const g=document.createElement("div");
      g.className="group"; g.dataset.file=f.file||"";
      g.innerHTML=`<span>${esc(f.file||"—")}</span><span class="n">${esc(t("panel.finding.fileCount",{count:DATA.filter(x=>x.file===f.file).length}))}</span>`;
      list.appendChild(g);
    }
    list.appendChild(findingEl(f));
    const b=document.createElement("b");
    b.style.background=SEV[f.sev]||SEV.minor; b.title=sevLabel(f.sev)+" — "+f.title; b.dataset.i=f.i;
    b.onclick=()=>focusFinding(f.i,true);
    spine.appendChild(b);
  });
  counts(); filter(); syncResolved();
}

function findingEl(f){
  const el=document.createElement("div");
  el.className="finding"; el.dataset.sev=f.sev; el.dataset.i=f.i;
  el.style.setProperty("--sev",SEV[f.sev]||SEV.minor);
  const parts=[];
  const expl=f.explanation!=null?f.explanation:f.body;
  if(expl) parts.push(`<p class="txt">${inline(expl)}</p>`);
  if(f.impact) parts.push(`<p class="txt"><span class="lab">${esc(t("panel.finding.impact"))}</span>${inline(f.impact)}</p>`);
  if(!expl&&!f.impact) parts.push(`<p class="txt">${esc(t("panel.finding.noDetail"))}</p>`);
  if(f.original) parts.push(codeBlock("panel.finding.currentCode",f.original,false));
  if(f.patch)    parts.push(codeBlock("panel.finding.suggestedFix",f.patch,true));
  el.innerHTML=`
    <div class="f-head" role="button" tabindex="0" aria-expanded="false">
      <span class="caret">▶</span>
      <span class="f-main">
        <span class="f-title">${inline(f.title)}</span>
        <span class="f-meta">
          <span class="sev">${esc(sevLabel(f.sev))}</span>
          ${f.file?`<a class="loc" data-act="open">${esc(locText(f))}</a>`:""}
          <span>${esc(f.rule||"")}</span>
        </span>
      </span>
      <button class="tick" data-act="resolve" title="${esc(t("panel.finding.resolvedTip"))}">✓</button>
    </div>
    <div class="f-body">
      ${parts.join("")}
      <div class="f-actions">
        ${f.file?`<button class="btn small" data-act="open">${esc(t("panel.finding.openInEditor"))}</button>`:""}
        <button class="btn small" data-act="copy">${esc(t("panel.finding.copyFinding"))}</button>
        <button class="btn small" data-act="resolve" data-resolve-label></button>
      </div>
    </div>`;
  return el;
}
function codeBlock(labelKey,code,fix){
  return `<div class="code${fix?" fix":""}"><div class="c-head"><span>${esc(t(labelKey))}</span><span class="spacer"></span>
    <button class="btn icon" data-act="snippet" title="${esc(t("panel.finding.copySnippet"))}">⧉</button></div><pre>${esc(code)}</pre></div>`;
}

function emptyEl(titleKey,bodyKey,actions,spin,rawBody){
  const d=document.createElement("div");
  d.className="empty"+(VIEW==="error"?" err":"");
  d.innerHTML=(spin?'<div class="spinner"></div>':"")+`<strong>${esc(t(titleKey))}</strong>`
    +esc(rawBody!=null?rawBody:(bodyKey?t(bodyKey):""))
    +(actions.length?`<div class="actions">${actions.map(([act,k,p])=>`<button class="btn${p?" primary":""}" data-act="${act}">${esc(t(k))}</button>`).join("")}</div>`:"");
  return d;
}
function emptyState(...a){ $("#list").appendChild(emptyEl(...a)); counts(); setStatus(); }

function summaryCard(){
  const d=document.createElement("div"); d.className="summary";
  const risk=(SUMMARY.risk||t("status.riskUnknown"));
  const c=s=>DATA.filter(f=>f.sev===s).length;
  d.innerHTML=`<div class="s-head"><h2>${esc(t("panel.summary.title"))}</h2>
      <span class="risk ${esc(risk.toLowerCase())}">${esc(t("panel.summary.risk",{risk}))}</span><span class="spacer"></span>
      <span class="s-counts">${["blocker","major","minor"].filter(s=>c(s)).map(s=>`<span style="--c:${SEV[s]}">${c(s)} ${esc(sevLabel(s))}</span>`).join("")}</span></div>
    ${SUMMARY.text?`<p>${inline(SUMMARY.text)}</p>`:""}
    ${DATA.length?'<div class="bar"><i id="resBar"></i></div><span class="s-res" id="resText"></span>':""}`;
  return d;
}

function counts(){
  $$(".chip[data-sev]").forEach(c=>{
    const n=DATA.filter(f=>f.sev===c.dataset.sev).length;
    c.querySelector("[data-count]").textContent=n;
    if(c.dataset.sev==="nit") c.hidden=!n;
  });
}

/* Filter + highlight */
function filter(){
  const q=$("#q").value.trim().toLowerCase();
  $("#qClear").hidden=!q;
  const on=new Set($$(".chip[data-sev]").filter(c=>c.getAttribute("aria-pressed")==="true").map(c=>c.dataset.sev));
  const hideRes=$("#hideResolved").getAttribute("aria-pressed")==="true";
  let shown=0;
  $$(".finding").forEach(el=>{
    const f=DATA[+el.dataset.i];
    const hay=[f.title,f.file,f.rule,f.explanation,f.body,f.impact].join(" ").toLowerCase();
    const vis=on.has(f.sev)&&(!q||hay.includes(q))&&!(hideRes&&RESOLVED.has(keyOf(f)));
    el.classList.toggle("hidden",!vis);
    const dot=$(`.spine b[data-i="${f.i}"]`); if(dot) dot.style.display=vis?"":"none";
    if(vis){ shown++; if(q) openEl(el,true); }
    mark(el,q);
  });
  $$(".group").forEach(g=>{
    let n=g.nextElementSibling, any=false;
    while(n&&!n.classList.contains("group")){ if(n.classList.contains("finding")&&!n.classList.contains("hidden")) any=true; n=n.nextElementSibling; }
    g.hidden=!any;
  });
  const nm=$("#noMatch"); if(nm) nm.remove();
  if(VIEW==="results"&&DATA.length&&!shown){
    const d=emptyEl("panel.empty.noMatch",null,[["clearFilters","panel.empty.clearFilters"]]); d.id="noMatch";
    $("#list").appendChild(d);
  }
  setStatus(shown);
}
function mark(el,q){
  $$(".f-title,.f-body p.txt",el).forEach(n=>{
    const raw=n.dataset.raw||(n.dataset.raw=n.innerHTML);
    n.innerHTML=q?raw.replace(new RegExp("(?![^<]*>)("+q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","ig"),"<mark>$1</mark>"):raw;
  });
}
let statusOverride=null;
function setStatus(shown){
  const s=$("#status");
  if(statusOverride!=null){ s.textContent=statusOverride; return; }
  if(VIEW!=="results"||!DATA.length){ s.textContent=t("status.idle"); return; }
  s.textContent=t("panel.footer.shown",{shown:shown!=null?shown:DATA.length,total:DATA.length});
}

/* Resolve */
function toggleResolved(f){
  const k=keyOf(f), now=!RESOLVED.has(k);
  now?RESOLVED.add(k):RESOLVED.delete(k);
  syncResolved(); filter();
  toast(t(now?"panel.toast.resolved":"panel.toast.reopened"));
  if(now) nextFinding(1);
}
function syncResolved(){
  let done=0;
  $$(".finding").forEach(el=>{
    const f=DATA[+el.dataset.i], r=RESOLVED.has(keyOf(f));
    if(r) done++;
    el.classList.toggle("resolved",r);
    const lb=$("[data-resolve-label]",el); if(lb) lb.textContent=t(r?"panel.finding.reopen":"panel.finding.resolve");
    const dot=$(`.spine b[data-i="${f.i}"]`); if(dot) dot.classList.toggle("done",r);
  });
  const bar=$("#resBar"), txt=$("#resText");
  if(bar){ bar.style.width=(DATA.length?100*done/DATA.length:0)+"%"; }
  if(txt){ txt.textContent=done&&done===DATA.length?t("panel.summary.allResolved"):t("panel.summary.resolved",{done,total:DATA.length}); }
}

/* Focus / navigation */
function openEl(el,state){ el.toggleAttribute("open",state); $(".f-head",el).setAttribute("aria-expanded",state); }
function elOf(i){ return $(`.finding[data-i="${i}"]`); }
function focusFinding(i,expand){
  const el=elOf(i); if(!el) return;
  $$(".finding.cur").forEach(x=>x.classList.remove("cur"));
  $$(".spine b").forEach(x=>x.classList.toggle("active",+x.dataset.i===i));
  el.classList.add("cur"); cur=i;
  if(expand) openEl(el,true);
  $(".f-head",el).focus({preventScroll:true});
  el.scrollIntoView({behavior:"smooth",block:"nearest"});
}
function nextFinding(dir){
  const vis=$$(".finding:not(.hidden)"); if(!vis.length) return;
  let pos=vis.findIndex(el=>+el.dataset.i===cur);
  pos=pos<0?(dir>0?0:vis.length-1):Math.max(0,Math.min(vis.length-1,pos+dir));
  focusFinding(+vis[pos].dataset.i,false);
}
function openInIde(f){
  if(typeof window.ideOpenFile==="function") window.ideOpenFile(f.file,+f.line||1);
  else toast(t("panel.toast.wouldOpen",{file:f.file,line:f.line}));
}
function findingText(f){
  return `[${sevLabel(f.sev).toUpperCase()}] ${f.title}\n${f.file}${f.line?":"+f.line:""}${f.rule?"  ("+f.rule+")":""}`
    +((f.explanation||f.body)?"\n\n"+(f.explanation||f.body):"")
    +(f.impact?"\n\n"+t("panel.finding.impact")+": "+f.impact:"")
    +(f.patch?"\n\n"+f.patch:"");
}

/* ══════════════════════════════════════════════════════════════
   3. Events
   ══════════════════════════════════════════════════════════════ */
function doAction(act,el){
  const fe=el&&el.closest(".finding"), f=fe?DATA[+fe.dataset.i]:null;
  switch(act){
    case "run": $("#run").click(); break;
    case "settings": openSettings(); break;
    case "clearFilters":
      $("#q").value=""; $$(".chip[data-sev]").forEach(c=>c.setAttribute("aria-pressed","true"));
      $("#hideResolved").setAttribute("aria-pressed","false"); filter(); break;
    case "open": if(f){ focusFinding(f.i,false); openInIde(f); } break;
    case "copy": if(f) copyAndTell(findingText(f),t("panel.toast.findingCopied")); break;
    case "resolve": if(f){ cur=f.i; toggleResolved(f); } break;
    case "snippet": copyAndTell($("pre",el.closest(".code")).textContent,t("panel.toast.snippetCopied")); break;
  }
}
$("#list").addEventListener("click",e=>{
  const a=e.target.closest("[data-act]");
  if(a){ e.stopPropagation(); doAction(a.dataset.act,a); return; }
  const head=e.target.closest(".f-head");
  if(head){ const el=head.parentElement; focusFinding(+el.dataset.i,false); openEl(el,!el.hasAttribute("open")); }
});
$("#list").addEventListener("keydown",e=>{
  const head=e.target.closest&&e.target.closest(".f-head");
  if(head&&(e.key==="Enter"||e.key===" ")){ e.preventDefault(); const el=head.parentElement; openEl(el,!el.hasAttribute("open")); }
});

$("#q").addEventListener("input",filter);
$("#qClear").onclick=()=>{ $("#q").value=""; filter(); $("#q").focus(); };
$$(".chip[data-sev]").forEach(c=>{
  c.onclick=()=>{ c.setAttribute("aria-pressed",c.getAttribute("aria-pressed")!=="true"); filter(); };
  c.ondblclick=()=>{ $$(".chip[data-sev]").forEach(x=>x.setAttribute("aria-pressed",x===c)); filter(); };
});
const togglePressed=b=>{ const on=b.getAttribute("aria-pressed")!=="true"; b.setAttribute("aria-pressed",on); return on; };
$("#hideResolved").onclick=e=>{ togglePressed(e.currentTarget); filter(); };
$("#groupFile").onclick=e=>{ togglePressed(e.currentTarget); if(VIEW==="results") draw(); };

$("#wrapBtn").onclick=e=>{
  const on=document.body.classList.toggle("wrap-on");
  e.currentTarget.setAttribute("aria-pressed",on); e.currentTarget.classList.toggle("on",on);
};
let allOpen=false;
$("#expandBtn").onclick=()=>{ allOpen=!allOpen; $$(".finding").forEach(el=>openEl(el,allOpen)); $("#expandBtn").textContent=allOpen?"⌃":"⌄"; };
$("#copyAll").onclick=()=>{
  if(!DATA.length) return toast(t("panel.toast.nothingToCopy"),true);
  const sel=$("#scope");
  const head=[t("panel.markdown.heading"),"",t("panel.markdown.scope",{scope:sel.options[sel.selectedIndex].text}),
    t("panel.markdown.model",{model:$("#modelLine").textContent})];
  if(SUMMARY&&SUMMARY.risk) head.push(t("panel.markdown.risk",{risk:SUMMARY.risk}));
  if(SUMMARY&&SUMMARY.text) head.push("",SUMMARY.text);
  head.push("");
  const md=head.concat(DATA.map(f=>`## [${sevLabel(f.sev).toUpperCase()}] ${f.title}\n\`${f.file}${f.line?":"+f.line:""}\`${f.rule?" · "+f.rule:""}`
      +`${(f.explanation||f.body)?"\n\n"+(f.explanation||f.body):""}${f.impact?"\n\n**"+t("panel.finding.impact")+":** "+f.impact:""}`
      +`${f.patch?"\n\n```"+(f.language||"")+"\n"+f.patch+"\n```":""}`)).join("\n");
  copyAndTell(md,t("panel.toast.reviewCopied"));
};
function openSettings(){ if(typeof window.ideSettings==="function") window.ideSettings(); }
$("#settingsBtn").onclick=openSettings;
const help=$("#help");
$("#helpBtn").onclick=()=>{ help.hidden=false; $("#helpClose").focus(); };
$("#helpClose").onclick=()=>{ help.hidden=true; };
help.onclick=e=>{ if(e.target===help) help.hidden=true; };
$$("footer [data-click]").forEach(h=>h.onclick=()=>$("#"+h.dataset.click).click());

/* Tabs */
$$(".tab").forEach(tb=>tb.onclick=()=>{
  $$(".tab").forEach(x=>x.setAttribute("aria-selected",x===tb));
  $$(".panel").forEach(p=>p.classList.toggle("show",p.id==="p-"+tb.dataset.tab));
});
const activePanel=()=>$(".panel.show");
$("#copyTab").onclick=()=>copyAndTell(activePanel().innerText,t("panel.toast.tabCopied"));
$("#clearTab").onclick=()=>{ $("pre",activePanel()).textContent=t("panel.tabs.cleared"); };
$("#follow").onclick=e=>{ const on=togglePressed(e.currentTarget); e.currentTarget.classList.toggle("on",on); };
const following=()=>$("#follow").getAttribute("aria-pressed")==="true";

/* Splitter — drag or arrow keys */
(function(){
  const s=$("#split"),b=$("#bottom");let y0,h0;
  const clamp=h=>Math.max(90,Math.min(innerHeight-220,h))+"px";
  const move=e=>{ b.style.height=clamp(h0+(y0-e.clientY)); };
  const up=()=>{ s.classList.remove("drag"); document.removeEventListener("mousemove",move); document.removeEventListener("mouseup",up); };
  s.addEventListener("mousedown",e=>{ y0=e.clientY;h0=b.offsetHeight;s.classList.add("drag");
    document.addEventListener("mousemove",move); document.addEventListener("mouseup",up); e.preventDefault(); });
  s.addEventListener("dblclick",()=>{ b.style.height=b.offsetHeight>120?"90px":"210px"; });
  s.addEventListener("keydown",e=>{
    if(e.key==="ArrowUp"||e.key==="ArrowDown"){ e.preventDefault(); b.style.height=clamp(b.offsetHeight+(e.key==="ArrowUp"?24:-24)); }
  });
})();

/* Run / stop */
let running=false, startedAt=0, tick=null;
function append(pre,text,cls){
  const n=cls?Object.assign(document.createElement("span"),{className:cls,textContent:text}):document.createTextNode(text);
  pre.appendChild(n);
  if(following()) pre.parentElement.scrollTop=pre.parentElement.scrollHeight;
}
function traceClass(l){
  if(/^(ERROR|✕)/i.test(l)) return "e";
  if(/^(===|▸)/.test(l)) return "k";
  if(/^(✓|Review complete|Summary)/i.test(l)) return "g";
  if(/^(⚠|WARN)/i.test(l)) return "w";
  return "";
}
$("#run").onclick=()=>{
  if(running) return;
  if(typeof window.ideRun==="function") window.ideRun($("#scope").value);
};
$("#stop").onclick=()=>{ if(typeof window.ideStop==="function") window.ideStop(); };

/* Shortcuts */
addEventListener("keydown",e=>{
  const mod=e.ctrlKey||e.metaKey, k=e.key.toLowerCase();
  const typing=/^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement&&document.activeElement.tagName);
  if(!help.hidden){ if(e.key==="Escape"||e.key==="?"){ e.preventDefault(); help.hidden=true; } return; }
  if(mod&&e.key==="Enter"){ e.preventDefault(); $("#run").click(); }
  else if(e.key==="Escape"){ if(running) $("#stop").click(); else if($("#q").value){ $("#q").value=""; filter(); } else if(typing) document.activeElement.blur(); }
  else if(mod&&e.shiftKey&&k==="c"){ e.preventDefault(); $("#copyAll").click(); }
  else if(mod&&k==="f"){ e.preventDefault(); $("#q").focus(); $("#q").select(); }
  else if(e.altKey&&k==="z"){ e.preventDefault(); $("#wrapBtn").click(); }
  else if(e.altKey&&k==="e"){ e.preventDefault(); $("#expandBtn").click(); }
  else if(typing||mod||e.altKey) return;
  else if(e.key==="?"){ e.preventDefault(); $("#helpBtn").click(); }
  else if(k==="j"||(e.key==="ArrowDown"&&$("#list").contains(document.activeElement))){ e.preventDefault(); nextFinding(1); }
  else if(k==="k"||(e.key==="ArrowUp"&&$("#list").contains(document.activeElement))){ e.preventDefault(); nextFinding(-1); }
  else if(cur>=0&&DATA[cur]&&(k==="o"||k==="c"||k==="x")){
    e.preventDefault();
    const el=elOf(cur); doAction({o:"open",c:"copy",x:"resolve"}[k],el&&$(".f-head",el));
  }
});

/* ══════════════════════════════════════════════════════════════
   4. Plugin API — called from WebReviewPanel via executeJavaScript
   ══════════════════════════════════════════════════════════════
   AICR.text({...})                 replace UI text map (from ui-text.yml) and redraw
   AICR.render([{sev:"blocker|major|minor|nit", title, file, line, rule,
                 explanation, impact, original, patch, language}])
   AICR.summary({risk, text})       summary card shown above findings
   AICR.trace(line[, cls])          append a trace line ("g"|"w"|"k"|"e"; auto if omitted)
   AICR.chunk(text)                 append a model-stream chunk
   AICR.context(text)               set the reviewed-context pane
   AICR.busy(true|false, status)    toggle spinner + status text
   AICR.model(line)  AICR.setScope(id)  AICR.scope()  AICR.error(msg)
   AICR.theme({bg:"#1e1f22", fg:"#dfe1e5", accent:"#7f52ff"})
   ══════════════════════════════════════════════════════════════ */
window.AICR={
  text:map=>{ TXT=Object.assign({},map||{}); applyText(); draw(); },
  render,
  summary:s=>{ SUMMARY=s||null; if(VIEW==="results") draw(); },
  trace:(l,c)=>{ append($("#trace"),l+"\n",c!=null?c:traceClass(l)); $("#nTrace").textContent=+$("#nTrace").textContent+1; },
  chunk:x=>append($("#stream"),x),
  context:x=>{ $("#context").textContent=x; $("#nCtx").textContent=(x.match(/\n/g)||[]).length; },
  busy:(on,s)=>{
    running=on; $("#run").disabled=on; $("#stop").disabled=!on; $("#scope").disabled=on;
    $("#run").textContent=t(on?"panel.running":"panel.run");
    $("#dot").classList.toggle("live",on); $("#prog").classList.toggle("run",on);
    clearInterval(tick);
    if(on){
      $("#trace").textContent=""; $("#stream").textContent=""; $("#context").textContent=t("panel.tabs.noContext");
      $("#nTrace").textContent="0"; $("#nCtx").textContent="0";
      DATA=[]; SUMMARY=null; VIEW="running"; draw();
      startedAt=Date.now(); const el=$("#elapsed"); el.hidden=false;
      const upd=()=>{ el.textContent=t("panel.footer.elapsed",{seconds:((Date.now()-startedAt)/1000).toFixed(1)}); };
      upd(); tick=setInterval(upd,100);
    }else{
      $("#elapsed").hidden=true;
      if(VIEW==="running"){ VIEW=DATA.length||SUMMARY?"results":"idle"; draw(); }
    }
    statusOverride=s!=null?s:(on?statusOverride:null);
    setStatus();
  },
  model:x=>{ const m=$("#modelLine"); m.removeAttribute("data-t"); m.textContent=x; },
  setScope:id=>{ $("#scope").value=id; },
  theme:o=>Object.entries(o).forEach(([k,v])=>document.documentElement.style.setProperty("--"+k,v)),
  error:msg=>{ DATA=[]; SUMMARY=null; ERRMSG=msg||""; VIEW="error"; draw(); },
  scope:()=>$("#scope").value,
  copy:copyText, toast
};

applyText();
draw();
})();
</script>
